
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi cuenta | Botane</title>

    <meta name="description" content="Accede a tu cuenta o regístrate en Botane.">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- NAVEGACIÓN -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container">

                <a class="navbar-brand" href="index.html">BOTANE</a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menuPrincipal">

                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">Productos</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">Nosotros</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>

                        <li class="nav-item">
                            <a class="btn btn-success ms-lg-2" href="carrito.html">
                                Carrito (<span id="contadorCarrito">0</span>)
                            </a>
                        </li>
                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <main class="container py-5">

        <div class="titulo-seccion mb-4">
            <h1>Mi cuenta</h1>
            <p>Accede a Botane y disfruta de tu experiencia de compra.</p>
        </div>

        <div class="row justify-content-center g-4">

            <!-- INICIAR SESIÓN -->
            <div class="col-12 col-md-6 col-lg-5">

                <div class="card h-100 shadow-sm p-4">

                    <h2 class="h4 mb-3">Iniciar sesión</h2>

                    <form id="formLogin">

                        <div class="mb-3">
                            <label for="loginCorreo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control"
                                id="loginCorreo" required>
                        </div>

                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control"
                                id="loginPassword" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Entrar a mi cuenta
                        </button>

                        <p id="mensajeLogin" class="mt-3 mb-0" aria-live="polite"></p>

                    </form>

                </div>

            </div>

            <!-- REGISTRO -->
            <div class="col-12 col-md-6 col-lg-5">

                <div class="card h-100 shadow-sm p-4">

                    <h2 class="h4 mb-3">Crear cuenta</h2>

                    <form id="formRegistro">

                        <div class="mb-3">
                            <label for="registroNombre" class="form-label">Nombre completo</label>
                            <input type="text" class="form-control"
                                id="registroNombre" required maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="registroTelefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control"
                                id="registroTelefono" required maxlength="20">
                        </div>

                        <div class="mb-3">
                            <label for="registroCorreo" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control"
                                id="registroCorreo" required>
                        </div>

                        <div class="mb-3">
                            <label for="registroPassword" class="form-label">Contraseña</label>
                            <input type="password" class="form-control"
                                id="registroPassword" required minlength="8">
                            <small class="text-muted">Mínimo 8 caracteres.</small>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Crear mi cuenta
                        </button>

                        <p id="mensajeRegistro" class="mt-3 mb-0" aria-live="polite"></p>

                    </form>

                </div>

            </div>

        </div>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="footer">
        <div class="container">
            <h2>BOTANE</h2>
            <p>Conectando naturaleza y bienestar.</p>
            <p>© 2026 Botane. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- JAVASCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cuenta.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
